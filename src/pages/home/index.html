<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" href="/src/shared/styles/global.css">
  <style>
    #imageContainer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
    .imageLayer, canvas { position: absolute; width: auto; }
    #instructionText {
      position: fixed;
      top: calc(50% - 30vh);
      right: calc(50% - (60vh + 15vw));
      left: auto;
      width: calc(20vw);
      z-index: 2000;
      font-family: 'Thata', sans-serif;
      font-size: 5vh;
      color: #000;
      text-align: left;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>
  <div class="lds-facebook">
    <div></div><div></div><div></div>
  </div>
  <div id="objectDescription"></div>
  <div id="toastContainer"></div>
  <div id="instructionText">Site inspirado em jogos indies dos anos 2010.
    Aqui se navega com o mouse, não com pressa.
    Melhor visto no computador.
    Passe por cima. Veja o que acontece.</div>
  <div id="imageContainer"></div>

  <script type="module">
    import { initMenuScene } from '/src/shared/scene/menuScene.js';
    import config from '/src/data/home.json';

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById('imageContainer');
      const { init } = initMenuScene(config);
      init(container);
    });
  </script>
</body>
</html>
