<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabeça</title>
  <link rel="stylesheet" href="/src/shared/styles/global.css">
  <style>
    html, body { background-color: #ffffff !important; }
    #imageContainer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
    .imageLayer, canvas { position: absolute; width: auto; top: 0; left: 0; }
    /* Engine base image (completo) is hidden visually; the head animation
       frames draw the opening states. It still sizes/positions everything. */
    #contentWrapper .imageLayer.headBaseImage,
    #contentWrapper .imageLayer.menuHitLayer { opacity: 0 !important; }
    .vectorBadge {
      position: absolute;
      top: 0;
      left: 0;
      width: auto;
      overflow: visible;
    }
    .vectorBadge rect {
      fill: #fff;
      stroke: #292929;
      stroke-width: 6;
    }
    .vectorBadge text {
      fill: #292929;
      font-family: 'Thata', sans-serif;
      font-weight: 400;
    }
    /* Badge overlays start hidden (opacity handled by headAnimation). */
    #instructionText {
      position: fixed;
      top: 16px;
      left: 50%;
      width: max-content;
      z-index: 2000;
      transform: translateX(-50%);
      font-family: 'Thata', sans-serif;
      font-size: clamp(30px, 5vh, 46px);
      color: #292929;
      text-align: center;
      pointer-events: none;
      will-change: opacity;
    }
  </style>
</head>
<body>
  <div class="lds-facebook">
    <div></div><div></div><div></div>
  </div>
  <div id="objectDescription"></div>
  <div id="toastContainer"></div>
  <div id="instructionText">Abra minha mente</div>
  <div id="imageContainer"></div>

  <script type="module">
    import { initMenuScene } from '/src/shared/scene/menuScene.js';
    import { initHeadAnimation } from '/src/shared/scene/headAnimation.js';
    import config from '/src/data/fwdlinks.json';

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById('imageContainer');
      const instructionEl = document.getElementById('instructionText');

      const { init } = initMenuScene(config);
      init(container);

      const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
      let headOpen = false;
      let headReady = false;

      // Keep the raster overlays for hit detection, but render the visible
      // buttons as SVG so borders and type stay sharp at every scale.
      const contentWrapper = document.getElementById('contentWrapper');
      const rasterBadges = Array.from(contentWrapper.querySelectorAll('.imageLayer:not(:first-child)'));
      rasterBadges.forEach((badge) => badge.classList.add('menuHitLayer'));

      const SVG_NS = 'http://www.w3.org/2000/svg';
      const badgeCenters = [];
      const badgeLabels = [];

      config.overlayImages.forEach((overlay, index) => {
        const precomputed = config.precomputedCentersByUrl[overlay.arquivo]
          || config.precomputedCentersByUrl[overlay.arquivo.replace(/^\//, '')];
        const centerX = precomputed.hitBboxCenterX ?? precomputed.bboxCenterX;
        const centerY = precomputed.hitBboxCenterY ?? precomputed.bboxCenterY;
        const width = precomputed.hitContentWidth ?? precomputed.contentWidth;
        const height = precomputed.hitContentHeight ?? precomputed.contentHeight;
        const left = centerX - width / 2;
        const top = centerY - height / 2;
        const label = overlay.buttonLabel;

        badgeCenters.push([precomputed.hitCenterX ?? precomputed.centerX, precomputed.hitCenterY ?? precomputed.centerY]);

        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.classList.add('vectorBadge');
        svg.setAttribute('viewBox', '0 0 1080 1920');
        svg.style.zIndex = String(10 + index);

        const rect = document.createElementNS(SVG_NS, 'rect');
        rect.setAttribute('x', String(left + 3));
        rect.setAttribute('y', String(top + 3));
        rect.setAttribute('width', String(width - 6));
        rect.setAttribute('height', String(height - 6));
        rect.setAttribute('rx', String(height * 0.18));
        rect.setAttribute('data-center-x', String(centerX));
        rect.setAttribute('data-center-y', String(centerY));

        const text = document.createElementNS(SVG_NS, 'text');
        text.textContent = label;
        text.setAttribute('x', String(centerX));
        text.setAttribute('y', String(centerY));
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('font-size', String(Math.min(height * 0.48, width / (label.length * 0.55))));

        svg.append(rect, text);
        contentWrapper.appendChild(svg);
        badgeLabels.push({ text, centerX, centerY });
      });

      document.fonts.ready.then(() => {
        badgeLabels.forEach(({ text, centerX, centerY }) => {
          for (let pass = 0; pass < 3; pass++) {
            const bounds = text.getBBox();
            const currentX = Number(text.getAttribute('x'));
            const currentY = Number(text.getAttribute('y'));
            text.setAttribute('x', String(currentX + centerX - bounds.x - bounds.width / 2));
            text.setAttribute('y', String(currentY + centerY - bounds.y - bounds.height / 2));
          }
        });
      });

      const baseImage = contentWrapper.querySelector('.imageLayer');
      function positionInstruction() {
        const baseRect = baseImage.getBoundingClientRect();
        if (!baseRect.height) {
          return;
        }
        const visibleHeadTop = baseRect.top + baseRect.height * (557 / 1920);
        instructionEl.style.left = `${baseRect.left + baseRect.width / 2}px`;
        instructionEl.style.top = `${Math.max(16, visibleHeadTop - instructionEl.offsetHeight - 16)}px`;
      }

      const { setOpenness } = initHeadAnimation({
        container,
        headFrame: '/fwdlinks/imagens/abra-white.webp',
        splitY: 0.46,
        // Visible alpha bounds of abra-white.webp in its 1920px frame.
        headContentTop: 557 / 1920,
        headContentBottom: 1482 / 1920,
        badgeSelector: '.vectorBadge',
        badgeCenters,
        animationSpeed: 0.08,
        onProgress: (progress) => {
          const opacity = Math.max(0, 1 - progress / 0.4);
          instructionEl.style.opacity = String(opacity);
          instructionEl.style.visibility = opacity > 0 ? 'visible' : 'hidden';
        },
        onOpen: () => { headReady = true; },
        onClose: () => { headReady = false; },
      });

      const instructionObserver = new MutationObserver(positionInstruction);
      instructionObserver.observe(baseImage, { attributes: true, attributeFilter: ['style'] });
      baseImage.addEventListener('load', positionInstruction, { once: true });
      window.addEventListener('resize', positionInstruction);
      requestAnimationFrame(positionInstruction);

      // ---- Opening interaction: mobile taps, desktop proximity ----------

      if (isTouch) {
        // Mobile: tap toggles the head open/closed (no hover).

        // Convert a tap (client coords) into the head image's natural 1080x1920
        // space so we can hit-test the menu buttons by their centers.
        function screenToNatural(clientX, clientY) {
          const base = document.querySelector('#contentWrapper .headBaseImage');
          const cw = document.getElementById('contentWrapper');
          if (!base || !cw) return null;
          const rect = base.getBoundingClientRect();
          const m = new WebKitCSSMatrix(getComputedStyle(cw).transform);
          const scaleX = rect.width / base.naturalWidth;
          const scaleY = rect.height / base.naturalHeight;
          return {
            x: (clientX - m.m41) / scaleX,
            y: (clientY - m.m42) / scaleY,
          };
        }

        container.addEventListener('click', (e) => {
          const nat = screenToNatural(e.clientX, e.clientY);
          // Which button (if any) is this tap on? (within a radius of its center)
          const badgeIdx = nat ? badgeCenters.findIndex(
            (c) => c && Math.hypot(nat.x - c[0], nat.y - c[1]) < 140
          ) : -1;
          if (headReady && badgeIdx >= 0) {
            // Fully revealed button: let the scene engine navigate.
            return;
          }

          // Block the scene engine for opening, closing, and in-flight taps.
          e.stopImmediatePropagation();
          if (headOpen && !headReady) {
            return;
          }

          headOpen = !headOpen;
          headReady = false;
          setOpenness(headOpen ? 1 : 0);
        }, { capture: true });

      } else {
        // Desktop: the head opens as the mouse approaches its center.
        const PROXIMITY_FULL_OPEN_PX = 430; // within this distance -> fully open
        const PROXIMITY_FULL_CLOSED_PX = 860; // beyond this -> fully closed

        let headCenter = { x: 0, y: 0 };
        let lastClient = null;

        function recalcHeadCenter() {
          const base = document.querySelector('#contentWrapper .headBaseImage');
          if (!base) return;
          const rect = base.getBoundingClientRect();
          if (rect.width === 0 || rect.height === 0) return;
          headCenter = {
            x: rect.left + rect.width / 2,
            y: rect.top + rect.height * 0.52,
          };
        }

        function updateOpenness(clientX, clientY) {
          if (!headCenter.x && !headCenter.y) recalcHeadCenter();
          const dx = clientX - headCenter.x;
          const dy = clientY - headCenter.y;
          const dist = Math.hypot(dx, dy);
          let o = (PROXIMITY_FULL_CLOSED_PX - dist) /
                  (PROXIMITY_FULL_CLOSED_PX - PROXIMITY_FULL_OPEN_PX);
          o = Math.max(0, Math.min(1, o));
          setOpenness(o);
        }

        container.addEventListener('pointermove', (e) => {
          if (e.pointerType && e.pointerType !== 'mouse') return;
          lastClient = { x: e.clientX, y: e.clientY };
          updateOpenness(e.clientX, e.clientY);
        }, { passive: true });

        window.addEventListener('resize', () => {
          recalcHeadCenter();
          if (lastClient) updateOpenness(lastClient.x, lastClient.y);
        });

        document.documentElement.addEventListener('mouseleave', () => setOpenness(0));

        window.addEventListener('load', () => {
          recalcHeadCenter();
          if (lastClient) updateOpenness(lastClient.x, lastClient.y);
        });
      }
    });
  </script>
</body>
</html>
