<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filme Fotográfico</title>
  <link rel="stylesheet" href="/src/shared/styles/global.css">
  <style>
    #imageContainer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
    .imageLayer, canvas { position: absolute; width: auto; }
    #instructionText {
      position: fixed;
      top: 46vh;
      right: 6vw;
      bottom: auto;
      left: auto;
      width: min(28vw, 300px);
      z-index: 2000;
      font-family: 'Thata', sans-serif;
      font-size: clamp(24px, 3.4vh, 34px);
      color: #000;
      text-align: left;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>
  <div class="lds-facebook">
    <div></div><div></div><div></div>
  </div>
  <div id="objectDescription"></div>
  <div id="toastContainer"></div>
  <div id="instructionText"></div>
  <div id="imageContainer"></div>

  <script type="module">
    import { initMenuScene } from '/src/shared/scene/menuScene.js';
    import config from '/src/data/filme-fotografico.json';

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById('imageContainer');
      const { init } = initMenuScene(config);
      init(container);
    });
  </script>
</body>
</html>
