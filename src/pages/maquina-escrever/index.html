<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máquina de Escrever</title>
  <link rel="stylesheet" href="/src/shared/styles/global.css">
  <style>
    #imageContainer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
    .imageLayer, canvas { position: absolute; width: auto; }
    #objectDescription {
      pointer-events: none;
      position: fixed;
      display: none;
      z-index: 3000;
      background-color: transparent;
      font-family: 'Thata', sans-serif;
      text-align: left;
      font-size: 4vh;
      max-width: 30vw;
      top: 20%;
    }
    #arrowLayer {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 2500;
    }
    .hand-drawn-arrow {
      fill: none;
      stroke: #1f1f1f;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="lds-facebook">
    <div></div><div></div><div></div>
  </div>
  <div id="objectDescription"></div>
  <svg id="arrowLayer">
    <defs>
      <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="0" refY="2" orient="auto">
        <polygon points="0 0, 6 2, 0 4" fill="#1f1f1f" />
      </marker>
    </defs>
    <path id="dynamicArrow" class="hand-drawn-arrow" d="" marker-end="url(#arrowhead)" />
  </svg>
  <div id="toastContainer"></div>
  <div id="imageContainer"></div>

  <script type="module">
    import { initMenuScene } from '/src/shared/scene/menuScene.js';
    import config from '/src/data/maquina-escrever.json';

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById('imageContainer');
      const { init } = initMenuScene(config);
      init(container);
    });
  </script>
</body>
</html>
