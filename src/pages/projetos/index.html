<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projetos Desktop</title>
  <link rel="stylesheet" href="/src/shared/styles/global.css">
  <style>
    #desktopContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1vw;
      width: 100%;
      height: 100%;
      padding: 1vw;
      box-sizing: border-box;
    }
    .desktop-item {
      --icon-size: clamp(420px, 60vw, 880px);
      flex: 1;
      max-width: 700px;
      min-width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.1s;
    }
    .desktop-item:active { transform: scale(0.98); }
    .icon-wrapper {
      position: relative;
      width: var(--icon-size);
      aspect-ratio: 1 / 1;
      padding-bottom: 0;
      margin-bottom: 0px;
      overflow: hidden;
    }
    .desktop-icon {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      transition: opacity 0.2s;
    }
    .icon-base { opacity: 1; }
    .icon-active { opacity: 0; }
    .icon-label {
      font-family: 'Thata', sans-serif;
      font-size: calc(var(--icon-size) / 9);
      color: #000000;
      text-align: center;
      text-shadow: none;
      padding: 0;
      margin-top: 0;
      transform: translateY(calc(var(--icon-size) * -0.28));
      min-height: 0.8em;
      line-height: 0.9;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
    }
    .desktop-item.hovered .icon-label { }
  </style>
</head>
<body>
  <div class="lds-facebook">
    <div></div><div></div><div></div>
  </div>
  <div id="desktopContainer"></div>

  <script type="module">
    import { initMenuDesktop } from '/src/shared/desktop/menuDesktop.js';
    import config from '/src/data/projetos.json';

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById('desktopContainer');
      const { init } = initMenuDesktop(config);
      init(container);
    });
  </script>
</body>
</html>
