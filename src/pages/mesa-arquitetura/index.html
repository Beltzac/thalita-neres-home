<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa Arquitetura</title>
  <!-- preload above-fold images so browser fetches before JS runs -->
  <link rel="preload" as="image" href="/mesa-arquitetura/19.webp" fetchpriority="high">
  <link rel="preload" as="image" href="/mesa-arquitetura/2.webp" fetchpriority="high">
  <link rel="preload" as="image" href="/mesa-arquitetura/1.webp" fetchpriority="high">
  <link rel="preload" as="image" href="/mesa-arquitetura/3.webp" fetchpriority="high">
  <link rel="preload" as="image" href="/mesa-arquitetura/6.webp" fetchpriority="high">
  <link rel="preload" as="image" href="/mesa-arquitetura/4.webp">
  <link rel="preload" as="image" href="/mesa-arquitetura/5.webp">
  <link rel="preload" as="image" href="/mesa-arquitetura/9.webp">
  <link rel="stylesheet" href="/src/shared/styles/global.css">
  <style>
    html, body {
      background-color: transparent !important;
    }

    #mesaContainer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: url("/assets/cursors/cursor-normal.ico") 32 0, auto;
    }

    .mesa-item {
      user-select: none;
      touch-action: none;
      transition: filter 0.18s ease, transform 0.18s ease;
      will-change: left, top;
    }

    .mesa-item img {
      display: block;
      pointer-events: none;
    }

    .mesa-item.mesa-hovered {
      filter: brightness(1.12);
      transform: scale(1.04);
      z-index: 10;
    }

    .mesa-item.mesa-dragging {
      filter: brightness(1.08);
      transform: scale(1.06);
      z-index: 1000;
    }

    .lds-facebook {
      z-index: 100000;
    }

    /* lightbox */
    .mesa-lightbox-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0,0,0,0);
      transition: background 0.3s ease;
      pointer-events: none;
    }
    .mesa-lightbox-backdrop.mesa-lightbox-open {
      background: transparent;
      pointer-events: auto;
    }

    .mesa-lightbox-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: left 0.25s ease-in-out,
                  top 0.25s ease-in-out,
                  width 0.25s ease-in-out,
                  height 0.25s ease-in-out;
    }

    .mesa-lightbox-wrap .mesa-item {
      transition: none !important;
      filter: none !important;
    }
  </style>
</head>
<body>
  <div class="lds-facebook">
    <div></div><div></div><div></div>
  </div>
  <div id="objectDescription"></div>
  <div id="mesaContainer"></div>

  <script type="module">
    import { initMenuMesa } from '/src/shared/mesa/menuMesa.js';
    import config from '/src/data/mesa-arquitetura.json';

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById('mesaContainer');
      const { init } = initMenuMesa(config);
      init(container);
    });
  </script>
</body>
</html>
