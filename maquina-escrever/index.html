<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        const baseUrl = "";
        const baseImageFilename = "imagens/MAQUINA DE ESCREVER.png"; // Base image
        const margin = 60; // Configurable margin

        // Cursor images (64x64) + hotspot middle-top (32,0)
        const CURSOR_NORMAL = 'url("https://static.wixstatic.com/ficons/c1926f_399a50bac406469293fc94e423792f80~mv2.ico") 32 0, auto';
        const CURSOR_HOVER = 'url("https://static.wixstatic.com/ficons/c1926f_e709764e60a443dd8f35a92720005ffe~mv2.ico") 32 0, pointer';

        // Activate only when close to a centerpoint (in natural image pixels, ~3000x3000 space)
        const ACTIVE_RADIUS = 500;

        // Optional precomputed center data to avoid recalculating on every load.
        // Left empty as we are using local new images; the code will calculate these on the fly.
        const precomputedCentersByUrl = {};

        const overlayImages = [
            { 
                "nomeImagem": "Blog de arquitetura", 
                "arquivo": "imagens/BLOG.png", 
                "urlLink": "/blog-arquitetura",
                "description": "Arquitetos, movimentos, direção. História e crítica da arquitetura em reflexão."
            },
            { 
                "nomeImagem": "Substack", 
                "arquivo": "imagens/SUBSTACK.png", 
                "urlLink": "/substack",
                "description": "Textos livres, temas diversos. Pensar curto, pensar disperso."
            },
            { 
                "nomeImagem": "Ela Não Vai Quebrar (2020)", 
                "arquivo": "imagens/ELA N VAI QUEBRAR.png", 
                "urlLink": "/ela-nao-vai-quebrar",
                "description": "Livro de poesia, corpo sensível. Fragilidade como força visível."
            },
            { 
                "nomeImagem": "Moramos nas Chegadas e Também nas Partidas (2024)", 
                "arquivo": "imagens/MORAMOS NAS CHEGADAS.png", 
                "urlLink": "/moramos-nas-chegadas",
                "description": "Prosa em cartas, tempo suspenso. Ficar e ir no mesmo gesto denso."
            },
            { 
                "nomeImagem": "Opúsculo (2021–2023)", 
                "arquivo": "imagens/OPUSCULO.png", 
                "urlLink": "/opusculo",
                "description": "Textos reunidos sem mediação. Download livre, circulação."
            }
        ];

        document.addEventListener("DOMContentLoaded", function () {

            // Inject cursor CSS (global + except text inputs)
            {
                const style = document.createElement('style');
                style.type = 'text/css';
                style.innerHTML = `
          body { cursor: ${CURSOR_NORMAL}; }
          input, textarea, [contenteditable="true"] { cursor: text !important; }
        `;
                document.head.appendChild(style);
            }

            console.log(overlayImages.length + " imagens");

            let lastClosestImageIndex = -1;
            let lastMinDistance = Infinity;

            const imageContainer = document.getElementById('imageContainer');

            // Ensure this container uses our cursor switching (and doesn't get stuck with default)
            imageContainer.style.cursor = CURSOR_NORMAL;

            const contentWrapper = document.createElement('div');
            contentWrapper.id = 'contentWrapper';
            contentWrapper.style.position = 'absolute';
            contentWrapper.style.top = '0';
            contentWrapper.style.left = '0';
            contentWrapper.style.width = '100%';
            contentWrapper.style.height = '100%';
            imageContainer.appendChild(contentWrapper);

            let preProcessedOverlays = [];

            function createAndAppendImage(src, zIndex, visible) {
                const img = document.createElement('img');
                img.crossOrigin = "anonymous";
                img.src = src;
                img.classList.add('imageLayer');
                img.style.zIndex = zIndex;
                img.style.display = visible ? '' : 'none';
                contentWrapper.appendChild(img);
                return img;
            }

            const baseImage = createAndAppendImage(baseUrl + baseImageFilename, 1, true);
            let overlayElements = overlayImages.map((overlay, index) =>
                createAndAppendImage(baseUrl + overlay.arquivo, index + 2, false)
            );

            let loadedImages = 0;
            let totalImages = overlayElements.length + 1;

            let globalBaseCenter = null;
            let centersLogged = false;

            baseImage.onload = () => {
                globalBaseCenter = preProcessOverlays(baseImage);
                centerMenu(globalBaseCenter);
                loadedImages++;
                checkAllLoaded();
            };
            
            baseImage.onerror = () => {
                console.error("Failed to load base image: " + baseImage.src);
            }

            window.addEventListener('resize', () => {
                if (globalBaseCenter) centerMenu(globalBaseCenter);
            });

            overlayElements.forEach((img, index) => {
                img.onload = () => {
                    preProcessedOverlays[index] = preProcessOverlays(img, index);
                    loadedImages++;
                    checkAllLoaded();
                };
                 img.onerror = () => {
                    console.error("Failed to load overlay image: " + img.src);
                }
            });

            function checkAllLoaded() {
                if (loadedImages === totalImages) {
                    setupImagesEvents();
                    document.querySelector('.lds-facebook').style.display = 'none';

                    if (!centersLogged) {
                        centersLogged = true;
                        const exportMap = {};

                        if (globalBaseCenter && baseImage && baseImage.src) {
                            exportMap[baseImage.src] = globalBaseCenter;
                        }

                        overlayImages.forEach((overlay, index) => {
                            const data = preProcessedOverlays[index];
                            if (data) {
                                const key = baseUrl + overlay.arquivo;
                                exportMap[key] = data;
                            }
                        });

                        console.log('precomputedCentersByUrl JSON:', JSON.stringify(exportMap));
                    }
                }
            }

            function centerMenu(baseCenter) {
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;

                const availableWidth = viewportWidth;
                const availableHeight = viewportHeight - (2 * margin);

                const scaleX = availableWidth / baseCenter.contentWidth;
                const scaleY = availableHeight / baseCenter.contentHeight;
                const scale = Math.min(scaleX, scaleY);

                const targetHeight = baseCenter.height * scale;
                baseImage.style.height = targetHeight + "px";
                baseImage.style.width = "auto";

                overlayElements.forEach(img => {
                    img.style.height = targetHeight + "px";
                    img.style.width = "auto";
                });

                const scaledCenterX = baseCenter.bboxCenterX * scale;
                const scaledCenterY = baseCenter.bboxCenterY * scale;

                const offsetX = (viewportWidth / 2) - scaledCenterX;
                const offsetY = (viewportHeight / 2) - scaledCenterY;

                contentWrapper.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            }

            function setupImagesEvents() {
                imageContainer.addEventListener('mousemove', function (e) {
                    const isActive = findClosestImage(overlayElements, e.clientX, e.clientY);

                    const overlayData = isActive ? overlayImages[lastClosestImageIndex] : null;
                    const imageName = overlayData ? overlayData.nomeImagem : null;
                    const imageDesc = overlayData ? overlayData.description : null;

                    changeCursor(isActive);
                    showName(imageName, imageDesc, e.clientX, e.clientY);
                });

                imageContainer.addEventListener('click', function () {
                    // Only click if active
                    if (lastClosestImageIndex < 0 || lastMinDistance > ACTIVE_RADIUS) return;

                    const overlay = overlayImages[lastClosestImageIndex];
                    const preProcessed = preProcessedOverlays[lastClosestImageIndex];

                    if (!preProcessed.screenCenter) {
                        const style = window.getComputedStyle(contentWrapper);
                        const matrix = new WebKitCSSMatrix(style.transform);
                        const offsetX = matrix.m41;
                        const offsetY = matrix.m42;

                        const boundingBox = baseImage.getBoundingClientRect();
                        const refWidth = preProcessedOverlays[0] ? preProcessedOverlays[0].width : baseImage.naturalWidth;
                        const refHeight = preProcessedOverlays[0] ? preProcessedOverlays[0].height : baseImage.naturalHeight;

                        const scaleX = boundingBox.width / refWidth;
                        const scaleY = boundingBox.height / refHeight;

                        const centerX = (preProcessed.centerX * scaleX) + offsetX;
                        const centerY = (preProcessed.centerY * scaleY) + offsetY;

                        preProcessed.screenCenter = { centerX, centerY };
                    }

                    const centerX = preProcessed.screenCenter.centerX;
                    const centerY = preProcessed.screenCenter.centerY;

                    confettiExplosion(centerX, centerY);

                    setTimeout(() => {
                        window.parent.postMessage(overlay.urlLink, "*");
                        console.log('Url enviada:' + overlay.urlLink);
                    }, 500);
                });
            }

            function preProcessOverlays(overlay) {
                const key = overlay.src || overlay.currentSrc || '';

                if (key && precomputedCentersByUrl[key]) {
                    console.log('Using precomputed center data for image:', key, precomputedCentersByUrl[key]);
                    return precomputedCentersByUrl[key];
                }

                const offScreenCanvas = document.createElement('canvas');
                const ctx = offScreenCanvas.getContext('2d');

                offScreenCanvas.width = overlay.naturalWidth;
                offScreenCanvas.height = overlay.naturalHeight;

                ctx.drawImage(overlay, 0, 0);

                const imageData = ctx.getImageData(0, 0, offScreenCanvas.width, offScreenCanvas.height);
                const data = imageData.data;
                let totalX = 0;
                let totalY = 0;
                let count = 0;

                let minX = offScreenCanvas.width;
                let maxX = 0;
                let minY = offScreenCanvas.height;
                let maxY = 0;

                for (let y = 0; y < offScreenCanvas.height; y++) {
                    for (let x = 0; x < offScreenCanvas.width; x++) {
                        const alpha = data[(y * offScreenCanvas.width + x) * 4 + 3];
                        if (alpha > 0) {
                            totalX += x;
                            totalY += y;
                            count++;

                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }

                const centerX = count > 0 ? totalX / count : offScreenCanvas.width / 2;
                const centerY = count > 0 ? totalY / count : offScreenCanvas.height / 2;

                if (count === 0) {
                    minX = 0;
                    maxX = offScreenCanvas.width;
                    minY = 0;
                    maxY = offScreenCanvas.height;
                }

                const bboxCenterX = minX + (maxX - minX) / 2;
                const bboxCenterY = minY + (maxY - minY) / 2;

                const result = {
                    centerX,
                    centerY,
                    bboxCenterX,
                    bboxCenterY,
                    width: offScreenCanvas.width,
                    height: offScreenCanvas.height,
                    contentWidth: (maxX - minX) + 1,
                    contentHeight: (maxY - minY) + 1
                };

                if (key) {
                    let logicalName = null;
                    if (Array.isArray(overlayImages)) {
                        const match = overlayImages.find(o => (baseUrl + o.arquivo) === key || o.arquivo === key);
                        if (match) logicalName = match.nomeImagem;
                    }

                    console.log('Computed center data for image:', logicalName || key, key, JSON.stringify(result));
                } else {
                    console.log('Computed center data for image without src:', JSON.stringify(result));
                }

                return result;
            }

            // Finds closest overlay; "active" only if within ACTIVE_RADIUS
            function findClosestImage(overlayElements, x, y) {
                lastClosestImageIndex = -1;
                let minDistance = Infinity;

                const style = window.getComputedStyle(contentWrapper);
                const matrix = new WebKitCSSMatrix(style.transform);
                const offsetX = matrix.m41;
                const offsetY = matrix.m42;

                const localX = x - offsetX;
                const localY = y - offsetY;

                const boundingBox = baseImage.getBoundingClientRect();
                const refWidth = preProcessedOverlays[0] ? preProcessedOverlays[0].width : baseImage.naturalWidth;
                const refHeight = preProcessedOverlays[0] ? preProcessedOverlays[0].height : baseImage.naturalHeight;

                const scaleX = refWidth / boundingBox.width;
                const scaleY = refHeight / boundingBox.height;

                const scaledX = localX * scaleX;
                const scaledY = localY * scaleY;

                for (let i = 0; i < overlayElements.length; i++) {
                    const preProcessed = preProcessedOverlays[i];
                    const dx = scaledX - preProcessed.centerX;
                    const dy = scaledY - preProcessed.centerY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < minDistance) {
                        minDistance = distance;
                        lastClosestImageIndex = i;
                    }

                    overlayElements[i].style.display = 'none';
                }

                lastMinDistance = minDistance;

                const isActive = (lastClosestImageIndex >= 0) && (minDistance <= ACTIVE_RADIUS);

                if (isActive) {
                    overlayElements[lastClosestImageIndex].style.display = '';
                } else {
                    lastClosestImageIndex = -1;
                }

                return isActive;
            }

            function showToast(message) {
                const toastContainer = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.classList.add('toast');
                toast.textContent = message;

                toastContainer.appendChild(toast);

                setTimeout(() => { toast.style.opacity = 1; }, 100);

                setTimeout(() => {
                    toast.style.opacity = 0;
                    setTimeout(() => toastContainer.removeChild(toast), 500);
                }, 3000);
            }

            function showName(name, desc, x, y) {
                const nameContainer = document.getElementById('objectDescription');
                const titleEl = document.getElementById('descTitle');
                const subtitleEl = document.getElementById('descSubtitle');

                if (!name) {
                    nameContainer.style.display = 'none';
                    return;
                }

                titleEl.textContent = name;
                subtitleEl.textContent = desc || "";

                // Calculate position logic (similar to previous, but might need adjustment for 2 lines)
                const halfDescriptionHeight = nameContainer.offsetHeight / 2;
                const halfDescriptionWidth = nameContainer.offsetWidth / 2;
                const verticalOffset = 50;
                const borderOffset = 10;

                const adjustedX = x;
                const adjustedY = y;

                nameContainer.style.left = (adjustedX - halfDescriptionWidth) + 'px';

                if (adjustedY - verticalOffset - halfDescriptionHeight - borderOffset < 0) {
                    nameContainer.style.top = (adjustedY - halfDescriptionHeight + verticalOffset) + 'px';
                } else {
                    nameContainer.style.top = (adjustedY - halfDescriptionHeight - verticalOffset) + 'px';
                }

                nameContainer.style.display = 'block';
            }

            function changeCursor(isActive) {
                // Keep text inputs "text" cursor (CSS handles it). Here we only change our container.
                imageContainer.style.cursor = isActive ? CURSOR_HOVER : CURSOR_NORMAL;
            }
        });

        function confettiExplosion(x, y) {
            const numConfetti = 30;
            for (let i = 0; i < numConfetti; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = x + 'px';
                confetti.style.top = y + 'px';

                const size = Math.random() * 10 + 5;
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';

                const angle = Math.random() * 2 * Math.PI;
                const distance = Math.random() * 250 + 50;
                const translateX = Math.cos(angle) * distance;
                const translateY = Math.sin(angle) * distance;
                confetti.style.setProperty('--translateX', translateX + 'px');
                confetti.style.setProperty('--translateY', translateY + 'px');

                const initialRotation = Math.random() * 360;
                confetti.style.transform = `rotate(${initialRotation}deg)`;

                const duration = Math.random() * 1 + 2.5;
                confetti.style.animationDuration = duration + 's';

                confetti.style.animationDelay = Math.random() * 0.2 + 's';

                confetti.style.backgroundColor = `hsl(${Math.floor(Math.random() * 360)}, 80%, 60%)`;

                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), duration * 1000);
            }
        }
    </script>

    <style>
        @font-face {
            font-family: 'Thata';
            src: url('https://static.wixstatic.com/ufonts/c1926f_163cafe5c04d48cbbb27552644b8fe60/file.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #imageContainer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .imageLayer,
        canvas {
            position: absolute;
            width: auto;
        }

        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
        }

        .toast {
            background-color: #333;
            color: white;
            padding: 16px;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #objectDescription {
            pointer-events: none;
            position: absolute;
            display: none;
            z-index: 3000;
            background-color: rgb(243, 243, 243);
            padding: 8px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            font-family: 'Thata', sans-serif;
            text-align: center;
        }

        #descTitle {
            font-size: 4vh;
            font-weight: bold;
            display: block;
        }
        
        #descSubtitle {
             font-size: 2vh;
             display: block;
             margin-top: 4px;
             max-width: 300px;
             color: #555;
        }

        #instructionText {
            position: fixed;
            top: calc(50% - 30vh);
            right: calc(50% - (60vh + 15vw));
            left: auto;
            width: calc(20vw);
            z-index: 2000;
            font-family: 'Thata', sans-serif;
            font-size: 5vh;
            color: #000;
            text-align: left;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Loader */
        .lds-facebook {
            display: inline-block;
            position: absolute;
            width: 80px;
            height: 80px;
            z-index: 100000;
            top: calc(50% - 40px);
            left: calc(50% - 40px);
        }

        .lds-facebook div {
            display: inline-block;
            position: absolute;
            left: 8px;
            width: 16px;
            background: #000000;
            animation: lds-facebook 1.2s cubic-bezier(0, 0.5, 0.5, 1) infinite;
        }

        .lds-facebook div:nth-child(1) {
            left: 8px;
            animation-delay: -0.24s;
        }

        .lds-facebook div:nth-child(2) {
            left: 32px;
            animation-delay: -0.12s;
        }

        .lds-facebook div:nth-child(3) {
            left: 56px;
            animation-delay: 0;
        }

        @keyframes lds-facebook {
            0% {
                top: 8px;
                height: 64px;
            }

            50%,
            100% {
                top: 24px;
                height: 32px;
            }
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            opacity: 1;
            clip-path: polygon(50% 0%,
                    61% 35%,
                    98% 35%,
                    68% 57%,
                    79% 91%,
                    50% 70%,
                    21% 91%,
                    32% 57%,
                    2% 35%,
                    39% 35%);
            animation-name: confettiFall;
            animation-timing-function: ease-out;
            animation-fill-mode: forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translate(var(--translateX), var(--translateY)) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="lds-facebook">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div id="objectDescription">
        <span id="descTitle"></span>
        <span id="descSubtitle"></span>
    </div>
    <div id="toastContainer"></div>
    <div id="imageContainer"></div>
</body>

</html>
