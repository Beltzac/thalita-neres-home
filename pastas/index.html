<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastas Desktop</title>
    <script>
        const baseUrl = "";

        // Cursor images
        const CURSOR_NORMAL = 'url("https://static.wixstatic.com/ficons/c1926f_399a50bac406469293fc94e423792f80~mv2.ico") 32 0, auto';
        const CURSOR_HOVER = 'url("https://static.wixstatic.com/ficons/c1926f_e709764e60a443dd8f35a92720005ffe~mv2.ico") 32 0, pointer';

        const desktopItems = [
            {
                "id": "arquitetura",
                "label": "Arquitetura",
                "baseImage": "imagens/ARQUITETURA_BASE.png",
                "activeImage": "imagens/ARQUITETURA.png",
                "urlLink": "/portfolio-arquitetura"
            },
            {
                "id": "interiores",
                "label": "Interiores",
                "baseImage": "imagens/INTERIORES_BASE.png",
                "activeImage": "imagens/INTERIORES.png",
                "urlLink": "/interiores"
            },
            {
                "id": "mobiliario",
                "label": "Mobiliário",
                "baseImage": "imagens/MOBILIARIO_BASE.png",
                "activeImage": "imagens/MOBILIARIO.png",
                "urlLink": "/mobiliario"
            }
        ];

        document.addEventListener("DOMContentLoaded", function () {
            // Inject cursor CSS
            const style = document.createElement('style');
            style.type = 'text/css';
            style.innerHTML = `
                body { cursor: ${CURSOR_NORMAL}; }
                .desktop-item { cursor: ${CURSOR_HOVER}; }
            `;
            document.head.appendChild(style);

            const renderedItems = [];
            let lastActiveIndex = -1;

            desktopItems.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.classList.add('desktop-item');

                // Wrapper for images (Base + Active)
                const iconWrapper = document.createElement('div');
                iconWrapper.classList.add('icon-wrapper');

                const imgBase = document.createElement('img');
                imgBase.src = baseUrl + item.baseImage;
                imgBase.classList.add('desktop-icon', 'icon-base');

                const imgActive = document.createElement('img');
                imgActive.src = baseUrl + item.activeImage;
                imgActive.classList.add('desktop-icon', 'icon-active');

                iconWrapper.appendChild(imgBase);
                iconWrapper.appendChild(imgActive);

                // Label
                const label = document.createElement('div');
                label.classList.add('icon-label');
                label.textContent = item.label;

                itemDiv.appendChild(iconWrapper);
                itemDiv.appendChild(label);
                desktopContainer.appendChild(itemDiv);

                renderedItems.push({
                    item,
                    itemDiv,
                    iconWrapper,
                    imgBase,
                    imgActive
                });
            });

            function setActiveIndex(nextIndex) {
                if (nextIndex === lastActiveIndex) return;

                renderedItems.forEach((entry, i) => {
                    const isActive = i === nextIndex;
                    entry.imgActive.style.opacity = isActive ? '1' : '0';
                    entry.imgBase.style.opacity = isActive ? '0' : '1';
                    entry.itemDiv.classList.toggle('hovered', isActive);
                });

                lastActiveIndex = nextIndex;
            }

            function updateActiveFromPointer(x, y) {
                let closestIndex = -1;
                let closestDistance = Infinity;

                renderedItems.forEach((entry, i) => {
                    const rect = entry.iconWrapper.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const radius = Math.min(rect.width, rect.height) / 2;

                    const dx = x - centerX;
                    const dy = y - centerY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance <= radius && distance < closestDistance) {
                        closestDistance = distance;
                        closestIndex = i;
                    }
                });

                setActiveIndex(closestIndex);
            }

            desktopContainer.addEventListener('mousemove', (e) => {
                updateActiveFromPointer(e.clientX, e.clientY);
            });

            desktopContainer.addEventListener('mouseleave', () => {
                setActiveIndex(-1);
            });

            desktopContainer.addEventListener('mousedown', () => {
                if (lastActiveIndex < 0) return;
                document.querySelectorAll('.desktop-item').forEach(el => el.classList.remove('selected'));
                renderedItems[lastActiveIndex].itemDiv.classList.add('selected');
            });

            desktopContainer.addEventListener('click', () => {
                if (lastActiveIndex < 0) return;

                const entry = renderedItems[lastActiveIndex];
                const rect = entry.iconWrapper.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                confettiExplosion(centerX, centerY);

                setTimeout(() => {
                    window.parent.postMessage(entry.item.urlLink, "*");
                    console.log('Url enviada:' + entry.item.urlLink);
                }, 500);
            });

            // Hide loader
            document.querySelector('.lds-facebook').style.display = 'none';
        });

        function confettiExplosion(x, y) {
            const numConfetti = 30;
            for (let i = 0; i < numConfetti; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = x + 'px';
                confetti.style.top = y + 'px';

                const size = Math.random() * 10 + 5;
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';

                const angle = Math.random() * 2 * Math.PI;
                const distance = Math.random() * 250 + 50;
                const translateX = Math.cos(angle) * distance;
                const translateY = Math.sin(angle) * distance;
                confetti.style.setProperty('--translateX', translateX + 'px');
                confetti.style.setProperty('--translateY', translateY + 'px');

                const initialRotation = Math.random() * 360;
                confetti.style.transform = `rotate(${initialRotation}deg)`;

                const duration = Math.random() * 1 + 2.5;
                confetti.style.animationDuration = duration + 's';

                confetti.style.animationDelay = Math.random() * 0.2 + 's';

                confetti.style.backgroundColor = `hsl(${Math.floor(Math.random() * 360)}, 80%, 60%)`;

                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), duration * 1000);
            }
        }
    </script>

    <style>
        @font-face {
            font-family: 'Thata';
            src: url('https://static.wixstatic.com/ufonts/c1926f_163cafe5c04d48cbbb27552644b8fe60/file.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        #desktopContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1vw;
            width: 100%;
            height: 100%;
            padding: 1vw;
            box-sizing: border-box;
        }

        .desktop-item {
            --icon-size: clamp(420px, 60vw, 880px);
            flex: 1;
            max-width: 700px;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s;
        }

        .desktop-item:active {
            transform: scale(0.98);
        }

        .icon-wrapper {
            position: relative;
            width: var(--icon-size);
            aspect-ratio: 1 / 1;
            padding-bottom: 0;
            margin-bottom: 0px;
        }

        .desktop-icon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.2s;
        }

        .icon-base {
            opacity: 1;
        }

        .icon-active {
            opacity: 0;
        }

        .icon-label {
            font-family: 'Thata', sans-serif;
            font-size: calc(var(--icon-size) / 9);
            color: #000000;
            text-align: center;
            text-shadow: none;
            padding: 0;
            margin-top: 0;
            transform: translateY(calc(var(--icon-size) * -0.28));
            min-height: 0.8em; /* Reduced min-height */
            line-height: 0.9;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
        }

        .desktop-item.hovered .icon-label {
             /* background-color: rgba(0, 0, 128, 0.5); */ /* Classic selection blue */
             /* border: 1px dotted white; */
        }

        /* Loader */
        .lds-facebook {
            display: inline-block;
            position: absolute;
            width: 80px;
            height: 80px;
            z-index: 100000;
            top: calc(50% - 40px);
            left: calc(50% - 40px);
        }

        .lds-facebook div {
            display: inline-block;
            position: absolute;
            left: 8px;
            width: 16px;
            background: #000000;
            animation: lds-facebook 1.2s cubic-bezier(0, 0.5, 0.5, 1) infinite;
        }

        .lds-facebook div:nth-child(1) {
            left: 8px;
            animation-delay: -0.24s;
        }

        .lds-facebook div:nth-child(2) {
            left: 32px;
            animation-delay: -0.12s;
        }

        .lds-facebook div:nth-child(3) {
            left: 56px;
            animation-delay: 0;
        }

        @keyframes lds-facebook {
            0% {
                top: 8px;
                height: 64px;
            }

            50%,
            100% {
                top: 24px;
                height: 32px;
            }
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            opacity: 1;
            clip-path: polygon(50% 0%,
                    61% 35%,
                    98% 35%,
                    68% 57%,
                    79% 91%,
                    50% 70%,
                    21% 91%,
                    32% 57%,
                    2% 35%,
                    39% 35%);
            animation-name: confettiFall;
            animation-timing-function: ease-out;
            animation-fill-mode: forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translate(var(--translateX), var(--translateY)) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="lds-facebook">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div id="desktopContainer"></div>
</body>

</html>
